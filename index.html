<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A.O SOARING ESTATE</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--tx:#1b2a24;--mut:#667a70;--pri:#5a1e0a;--acc:#ff6a00;--bd:#e3dfd3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101613;--card:#18211c;--tx:#eef2ee;--mut:#9aa8a0;--pri:#ff7a1f;--acc:#ff9a4d;--bd:#2a362f}}
:root[data-theme="dark"]{--bg:#101613;--card:#18211c;--tx:#eef2ee;--mut:#9aa8a0;--pri:#ff7a1f;--acc:#ff9a4d;--bd:#2a362f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body.lock{overflow:hidden}
header{background:#fff;color:#5a1e0a;padding:8px 16px;border-bottom:4px solid #ff6a00}.logo{height:56px;width:auto;display:block}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
header .wrap{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0}
.brand{font-weight:800;letter-spacing:.06em;font-size:1.1rem}.brand small{display:block;font-weight:400;letter-spacing:0;opacity:.85;font-size:.78rem}
.btn{border:0;border-radius:10px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer;background:var(--pri);color:#fff;text-decoration:none;display:inline-block}
.btn.wa{background:#1fa855}.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}.btn.red{background:#c0392b}.btn.sm{padding:6px 10px;font-size:.85rem}
header .btn{background:#1fa855}
.hero{padding:22px 0 8px}.hero h1{margin:0 0 4px;font-size:1.5rem}.hero p{margin:0;color:var(--mut)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px;margin:14px 0}
input,select,textarea{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;padding-bottom:30px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.ph{aspect-ratio:4/3;background:linear-gradient(135deg,var(--pri),var(--acc));display:flex;align-items:center;justify-content:center;font-size:3rem;position:relative;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.tag{position:absolute;top:8px;left:8px;background:var(--acc);color:#111;font-size:.75rem;font-weight:700;padding:3px 8px;border-radius:99px}
.tag.sold{background:#c0392b;color:#fff;left:auto;right:8px}
.cb{padding:12px;display:flex;flex-direction:column;gap:4px;flex:1}
.price{font-weight:800;font-size:1.1rem}.mut{color:var(--mut);font-size:.9rem}
.cb .btn{margin-top:8px;text-align:center}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-start;justify-content:center;overflow:auto;z-index:20;padding:16px}
.ov[data-open]{display:flex}
.modal{background:var(--card);border-radius:16px;max-width:640px;width:100%;overflow:hidden}
.modal .mb{padding:16px;display:grid;gap:8px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:#000}
.gal .ph{min-width:100%;scroll-snap-align:start;border-radius:0}
.x{float:right}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:14px 0;display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--bd);border-radius:10px;padding:8px;flex-wrap:wrap}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:70px;height:70px;object-fit:cover;border-radius:8px}
.thumbs button{position:absolute;top:-6px;right:-6px;border:0;border-radius:99px;background:#c0392b;color:#fff;width:20px;height:20px;cursor:pointer}
footer{padding:20px 14px 40px;text-align:center;color:var(--mut);font-size:.85rem}
footer a{color:var(--mut)}
.float{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:99px;background:#1fa855;color:#fff;display:flex;align-items:center;justify-content:center;font-size:1.6rem;text-decoration:none;box-shadow:0 4px 14px rgba(0,0,0,.3);z-index:10}
@media(max-width:560px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/3}.row{grid-template-columns:1fr}}
.err{color:#c0392b}label{display:grid;gap:4px;font-size:.9rem;color:var(--mut)}</style></head>
<body>
<header><div class="wrap"><img class="logo" src="logo.png" alt="A.O SOARING ESTATE LTD – Lets Build Nations"><a class="btn" id="hwa" target="_blank" rel="noopener">WhatsApp us</a></div></header>
<div class="wrap" id="app"></div>
<footer>© A.O SOARING ESTATE LTD</footer>
<a class="float" id="fwa" target="_blank" rel="noopener" aria-label="WhatsApp">💬</a>
<div class="ov" id="ov"></div>
<script type="module">
import {BLOB} from "./config.js";
const WA="2348155074037",KINDS=["House / Duplex","Flat / Apartment","Land","Commercial","Self-contain / Room"];
let last="",P=[],F={q:"",t:"",k:""},view="home",D=null,user=null,loaded=false,fail="";
const ID=(String(BLOB).match(/[0-9a-zA-Z-]{12,}\/?$/)||[""])[0].replace("/",""),ok=!!ID&&!String(BLOB).startsWith("PASTE"),API="https://jsonblob.com/api/jsonBlob/"+ID,srt=a=>a.slice().sort((x,y)=>(y.createdAt||0)-(x.createdAt||0));
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const price=p=>"₦"+Number(p.price||0).toLocaleString("en-NG")+(p.type==="rent"?" / year":"");
const wa=t=>"https://wa.me/"+WA+"?text="+encodeURIComponent(t);
const inq=p=>wa("Hello A.O SOARING ESTATE 👋\nI’m interested in this property:\n🏠 "+p.title+"\n📍 "+p.loc+"\n💰 "+price(p)+"\nRef: "+p.id);
const hi=wa("Hello A.O SOARING ESTATE, I’d like to enquire about your properties.");
$("#hwa").href=hi;$("#fwa").href=hi;
async function load(){try{const r=await fetch(API,{headers:{Accept:"application/json"},cache:"no-store"});if(!r.ok)throw new Error("HTTP "+r.status);const t=await r.text();if(loaded&&t===last)return;last=t;P=srt((JSON.parse(t).props||[]).map(p=>({...p,imgs:p.imgs||[]})));loaded=true;fail=""}catch(e){fail=e.message}refresh()}
if(ok){load();setInterval(()=>{if(!document.hidden&&!$("#ov").hasAttribute("data-open")&&document.activeElement.id!=="fq")load()},30000)}
function refresh(){home()}
function home(){
 const q=F.q.toLowerCase(),L=P.filter(p=>(!F.t||p.type===F.t)&&(!F.k||p.kind===F.k)&&(!q||(p.title+" "+p.loc+" "+p.desc).toLowerCase().includes(q)));
 const msg=!ok?"App not set up yet.":fail?"Could not load properties: "+esc(fail):!loaded?"Loading properties…":"No properties match. Try a different search.";
 $("#app").innerHTML='<div class="hero"><h1>Find your next home</h1><p>Houses, flats and land for sale or rent across Nigeria.</p></div>'+
 '<div class="filters"><input id="fq" placeholder="Search city, area or title" value="'+esc(F.q)+'"><select id="ft"><option value="">Buy or rent</option><option value="sale"'+(F.t=="sale"?" selected":"")+'>For sale</option><option value="rent"'+(F.t=="rent"?" selected":"")+'>For rent</option></select><select id="fk"><option value="">All types</option>'+KINDS.map(k=>'<option'+(F.k==k?" selected":"")+'>'+k+'</option>').join("")+'</select></div>'+
 '<div class="grid">'+(L.length?L.map(p=>'<div class="card" data-id="'+esc(p.id)+'"><div class="ph">'+(p.imgs[0]?'<img src="'+p.imgs[0]+'" alt="">':"🏠")+'<span class="tag">'+(p.type=="rent"?"For rent":"For sale")+'</span>'+(p.sold?'<span class="tag sold">'+(p.type=="rent"?"Taken":"Sold")+'</span>':"")+'</div><div class="cb"><div class="price">'+price(p)+'</div><div>'+esc(p.title)+'</div><div class="mut">📍 '+esc(p.loc)+'</div><div class="mut">'+(p.beds?"🛏 "+p.beds+" ":"")+(p.baths?" 🚿 "+p.baths:"")+" · "+esc(p.kind)+'</div><a class="btn wa" target="_blank" rel="noopener" href="'+inq(p)+'">I’m interested</a></div></div>').join(""):'<p class="mut">'+msg+'</p>')+'</div>';
 $("#fq").oninput=e=>{F.q=e.target.value;clearTimeout(home.t);home.t=setTimeout(()=>{home();const i=$("#fq");i.focus();i.setSelectionRange(99,99)},250)};
 $("#ft").onchange=e=>{F.t=e.target.value;home()};$("#fk").onchange=e=>{F.k=e.target.value;home()};
 document.querySelectorAll(".card").forEach(c=>c.onclick=e=>{if(e.target.closest("a"))return;openP(c.dataset.id)});
}
function ph(p,i){const im=p.imgs[i||0];return '<div class="ph">'+(im?'<img src="'+im+'" alt="">':"🏠")+'</div>'}
function openP(id){const p=P.find(x=>x.id===id);if(!p)return;
 $("#ov").innerHTML='<div class="modal"><div class="gal">'+(p.imgs.length?p.imgs.map((_,i)=>ph(p,i)).join(""):ph(p))+'</div><div class="mb"><button class="btn ghost sm x" id="cl">Close ✕</button><div class="price" style="font-size:1.4rem">'+price(p)+'</div><h2 style="margin:0">'+esc(p.title)+'</h2><div class="mut">📍 '+esc(p.loc)+' · '+esc(p.kind)+(p.beds?" · 🛏 "+p.beds:"")+(p.baths?" · 🚿 "+p.baths:"")+'</div><p style="white-space:pre-wrap;margin:6px 0">'+esc(p.desc)+'</p><a class="btn wa" target="_blank" rel="noopener" href="'+inq(p)+'">💬 I’m interested in this – message on WhatsApp</a></div></div>';
 $("#ov").setAttribute("data-open","");document.body.classList.add("lock");
 $("#cl").onclick=closeP;$("#ov").onclick=e=>{if(e.target.id==="ov")closeP()}}
function closeP(){$("#ov").removeAttribute("data-open");$("#ov").innerHTML="";document.body.classList.remove("lock")}
home();
</script></body></html>
